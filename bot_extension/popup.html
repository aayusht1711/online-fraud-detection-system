<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Aegis Bot Injector</title>
  <style>
    body {
      width: 310px;
      margin: 0;
      padding: 14px;
      background: #09090e;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      font-size: 12px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .badge {
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid rgba(244, 63, 94, 0.4);
      color: #fb7185;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }
    .title {
      font-weight: 800;
      font-size: 13px;
      letter-spacing: -0.3px;
      color: #fff;
    }
    .desc {
      color: #94a3b8;
      font-size: 10px;
      line-height: 1.4;
      margin-bottom: 10px;
    }
    .toggle-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 10px;
      margin-bottom: 12px;
      background: rgba(244, 63, 94, 0.08);
      border: 1px solid rgba(244, 63, 94, 0.25);
      border-radius: 8px;
    }
    .toggle-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .toggle-title {
      font-size: 11px;
      font-weight: 700;
      color: #fca5a5;
    }
    .toggle-sub {
      font-size: 9px;
      color: #94a3b8;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #334155;
      transition: .25s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .25s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: #e11d48; }
    input:checked + .slider:before { transform: translateX(16px); }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    button {
      width: 100%;
      padding: 9px 10px;
      border-radius: 8px;
      border: none;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      transition: all 0.15s ease;
    }
    .btn-danger {
      background: linear-gradient(135deg, #e11d48, #be123c);
      color: white;
      box-shadow: 0 2px 10px rgba(225, 29, 72, 0.3);
    }
    .btn-danger:hover {
      background: linear-gradient(135deg, #f43f5e, #e11d48);
    }
    .btn-warning {
      background: linear-gradient(135deg, #d97706, #b45309);
      color: white;
      box-shadow: 0 2px 10px rgba(217, 119, 6, 0.3);
    }
    .btn-warning:hover {
      background: linear-gradient(135deg, #f59e0b, #d97706);
    }
    .btn-secondary {
      background: #1e1b2e;
      color: #cbd5e1;
      border: 1px solid #3b3558;
    }
    .btn-secondary:hover {
      background: #28243d;
      color: white;
    }
    .btn-reset {
      background: #0f172a;
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .btn-reset:hover {
      background: #1e293b;
    }
    .status {
      margin-top: 10px;
      padding: 6px;
      border-radius: 6px;
      background: rgba(0,0,0,0.4);
      font-size: 10px;
      color: #94a3b8;
      text-align: center;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="badge">ATTACK ENGINE</span>
    <span class="title">Aegis Bot Injector</span>
  </div>
  <div class="desc">
    Simulate automated bot scripts, tarpit honeypot traps, and payment exfiltration.
  </div>

  <!-- Autonomous Bot Mode Toggle -->
  <div class="toggle-card">
    <div class="toggle-left">
      <span class="toggle-title">⚡ Autonomous Auto-Bot</span>
      <span class="toggle-sub">Auto-attacks whenever page loads</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="toggleAutoAttack">
      <span class="slider"></span>
    </label>
  </div>

  <div class="btn-group">
    <button id="btnFullAttack" class="btn-danger">
      <span>🚨</span> Full Attack (Login + Wire Payment)
    </button>
    <button id="btnWirePayment" class="btn-warning">
      <span>💸</span> Bot Wire Payment (Exfiltrate ₹75k)
    </button>
    <button id="btnUpiPayment" class="btn-secondary">
      <span>⚡</span> Bot UPI Scam Pay (ph0nepe@okaxis)
    </button>
    <button id="btnLinearCursor" class="btn-secondary">
      <span>🤖</span> Lock Linear Vector (H=0.08)
    </button>
    <button id="btnResetHuman" class="btn-reset">
      <span>🛡️</span> Reset to Legitimate Human
    </button>
  </div>
  <div id="statusBox" class="status">Target: http://127.0.0.1:5000</div>

  <script src="popup.js"></script>
</body>
</html>
